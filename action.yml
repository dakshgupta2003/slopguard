name: slopguard
description: Block AI-hallucinated and typosquatted dependencies before they reach your project.
branding:
  icon: shield
  color: orange

inputs:
  directory:
    description: Directory holding the manifests to check.
    required: false
    default: "."
  fail-on:
    description: Lowest verdict that fails the job — "block" or "warn".
    required: false
    default: block
  version:
    description: Version of slopguard to run.
    required: false
    default: latest

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SLOPGUARD_DIRECTORY: ${{ inputs.directory }}
        SLOPGUARD_FAIL_ON: ${{ inputs.fail-on }}
        SLOPGUARD_VERSION: ${{ inputs.version }}
      run: |
        set +e
        npx --yes "@daksh_dev_2003/slopguard@$SLOPGUARD_VERSION" scan "$SLOPGUARD_DIRECTORY"
        status=$?
        set -e

        if [ "$status" -eq 2 ]; then
          echo "::error::slopguard blocked a dependency"
          exit 1
        fi

        if [ "$status" -eq 1 ]; then
          echo "::warning::slopguard flagged a dependency"
          if [ "$SLOPGUARD_FAIL_ON" = "warn" ]; then
            exit 1
          fi
        fi

        if [ "$status" -gt 2 ]; then
          echo "::warning::slopguard did not run (exit $status) — nothing was checked"
        fi

        exit 0
